[project]
name = "sales-forecasting-frontend"
version = "1.0.0"
description = "Streamlit Frontend for Sales Forecasting with XAI"
requires-python = ">=3.10,<3.13"
dependencies = [
    "streamlit==1.35.0",
    "requests==2.32.3",
    "google-generativeai==0.8.3",
    "python-dotenv==1.2.1",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "matplotlib==3.10.7",
    "matplotlib-inline==0.2.1",
    "seaborn==0.13.2",
    "pyarrow==20.0.0",
    "shap==0.44.1",
    "lightgbm==4.3.0",
    "langchain-openai==1.1.5",
    "langchain-core==1.2.2",
    "sqlalchemy>=2.0.46",
    "psycopg2-binary>=2.9.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
