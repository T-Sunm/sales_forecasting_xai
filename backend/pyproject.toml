[project]
name = "sales-forecasting-backend"
version = "1.0.0"
description = "Backend API for Sales Forecasting with XAI"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn==0.32.1",
    "pydantic==2.10.3",
    "python-multipart==0.0.20",
    "lightgbm==4.3.0",
    "xgboost==3.1.2",
    "optuna==3.6.1",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "scikit-learn==1.5.1",
    "shap==0.44.1",
    "joblib==1.4.2",
    "pyarrow==20.0.0",
    "statsmodels==0.14.5",
    "prophet==1.2.1",
    "beautifulsoup4==4.14.2",
    "sqlalchemy>=2.0.45",
    "psycopg2-binary>=2.9.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
